  <body>
    <script>
      //구조분해 (비구조할당) - 배열
      const arr = [1, 2, 3, 4, 5];
      const num1 = arr[0];
      const num2 = arr[1];
      const num3 = arr[2];
      const num4 = arr[3];
      const num5 = arr[4];

      const [n1, n2, n3, n4, n5] = arr; //배열은 무조건 순서대로, 변수명 지정해줘야함 + 개수 마음대로도 X

      function getData() {
        const student = {
          name: "김준일",
          age: 32,
        };

        const serverPort = 8080;
        const status = 200;

        return [student, serverPort, status];
      }

      const [s, sp, st] = getData(); //구조분해
      console.log(s);
      console.log(sp);
      console.log(st);

      //useState 미리보기
      function useState(value) {
        let v = initValue;

        const setter = (value) => {
          v = value;
        };

        const getter = () => {
          return v;
        };

        return [ v, setter, getter ];
      }

      const [username, setUsername] = useState("김준이");
      console.log(username);
      console.log(getUsername());
      setUsername("김준일");
      console.log(username);      //여기선 그냥 v = 즉 초기값 김준이 출력
      console.log(getUsername());  //리턴 v 니까 getter 로 받음 
    </script>
