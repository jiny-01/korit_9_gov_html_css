<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var num = 10;
      var dnum = 10.5;
      var char = "a";
      var str = "abc";
      var isOpen = true;
      var arr = [1, 2, "a", "b", [3, 4]];

      console.log(num);   //10
      console.log(dnum);
      console.log(char);
      console.log(str);
      console.log(isOpen);
      console.log(arr[0]); //1
      console.log(arr[4][1]); //4

      console.log(typeof num); //number
      console.log(typeof dnum);
      console.log(typeof char);
      console.log(typeof str);
      console.log(typeof isOpen);
      console.log(typeof arr);  //object
    </script>
  </body>
</html>
