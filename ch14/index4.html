<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // 콜백 함수

        function fx(callback, a, b) {
    
            if (a === undefined || b === undefined) {
                console.log(callback());
                return;
            }
            const result = callback(a, b);
            console.log("결과: " + result);
        }

        fx(function print() {console.log("출력")});  //fx 함수를 호출할 때 매개변수로 print() 함수 정의를 대입/주입 => "출력" 이 결과
        fx(function add(a, b) {return a + b;});      //console.log(return a + b) 이므로 연산불가 => NaN 
        fx(function add(a, b) {return a + b;}, 10);  //b=빈 값 이므로 undefined + undefined => NaN
        fx(function add(a, b) {return a + b;}, 10, 20); //a=10, b-20 이므로 => 30

        // console.log(callback());  
        // const result = callback() // 콜백 함수를 호출해서 실행한 결과값을 result
        // console.log(result);
    </script>
    </script>
</body>
</html>
